    <circle class="halo" style="animation-delay:1.80s" cx="772.5" cy="396.8" r="36" fill="#8AA4FF"/>
    <circle cx="772.5" cy="396.8" r="24" fill="#0F1117" stroke="#8AA4FF" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="772.5" y="401.8" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#8AA4FF">AG</text>
    <text x="772.5" y="452.8" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#E6E8EE">Antigravity</text>
