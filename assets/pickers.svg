<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 378" width="1280" height="378" xml:space="preserve" role="img" aria-labelledby="t d">
  <title id="t">Same chat, every picker</title>
  <desc id="d">Claude Code's /resume, OpenCode's session list and hop list side by side. Chats from other agents appear in each list, tagged with the agents they came through.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cc { fill: #E8845C; } .oc { fill: #5EEAD4; } .ag { fill: #8AA4FF; } .cx { fill: #F5C451; }
      .km { fill: #34D399; } .qw { fill: #A78BFA; } .pi { fill: #F472B6; }
      .dim { fill: #6B7385; } .txt { fill: #E5E7EB; } .sub { fill: #8A93A6; }
      text { white-space: pre; }
    </style>
    <clipPath id="bg"><rect width="1280" height="378" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#bg)"><rect width="1280" height="378" fill="#0A0B10"/></g>
  <rect x=".5" y=".5" width="1279" height="377" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- Claude Code -->
  <g transform="translate(24 24)">
    <rect width="392" height="330" rx="14" fill="#10131A" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M14 0H378A14 14 0 0 1 392 14V40H0V14A14 14 0 0 1 14 0Z" fill="#151923"/>
    <circle cx="20" cy="20" r="5" fill="#FF5F57"/><circle cx="37" cy="20" r="5" fill="#FEBC2E"/><circle cx="54" cy="20" r="5" fill="#28C840"/>
    <text x="196" y="25" text-anchor="middle" class="mono sub" font-size="12">claude  ›  /resume</text>
    <text x="20" y="72" class="sans sub" font-size="12">Resume a conversation</text>
    <rect x="10" y="84" width="372" height="28" rx="6" fill="#1C2130"/>
    <text x="20" y="103" class="mono txt" font-size="13"><tspan class="cc">❯</tspan> Auth refactor <tspan class="dim">(</tspan><tspan class="ag">Agy</tspan><tspan class="dim">+</tspan><tspan class="cx">Codex</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="103" text-anchor="end" class="mono dim" font-size="12">2m</text>
    <text x="20" y="135" class="mono txt" font-size="13">  Flaky e2e test</text>
    <text x="372" y="135" text-anchor="end" class="mono dim" font-size="12">1h</text>
    <text x="20" y="165" class="mono txt" font-size="13">  GPU crash triage <tspan class="dim">(</tspan><tspan class="km">Kimi</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="165" text-anchor="end" class="mono dim" font-size="12">3h</text>
    <text x="20" y="195" class="mono txt" font-size="13">  Landing page polish <tspan class="dim">(</tspan><tspan class="qw">Qwen</tspan><tspan class="dim">+</tspan><tspan class="pi">Pi</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="195" text-anchor="end" class="mono dim" font-size="12">1d</text>
    <text x="20" y="225" class="mono txt" font-size="13">  Rate limiter design <tspan class="dim">(</tspan><tspan class="oc">OpenCode</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="225" text-anchor="end" class="mono dim" font-size="12">2d</text>
    <text x="20" y="312" class="sans dim" font-size="11">native chats untagged · imported chats tagged</text>
  </g>

  <!-- OpenCode -->
  <g transform="translate(444 24)">
    <rect width="392" height="330" rx="14" fill="#10131A" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M14 0H378A14 14 0 0 1 392 14V40H0V14A14 14 0 0 1 14 0Z" fill="#151923"/>
    <circle cx="20" cy="20" r="5" fill="#FF5F57"/><circle cx="37" cy="20" r="5" fill="#FEBC2E"/><circle cx="54" cy="20" r="5" fill="#28C840"/>
    <text x="196" y="25" text-anchor="middle" class="mono sub" font-size="12">opencode  ›  /sessions</text>
    <text x="20" y="72" class="sans sub" font-size="12">Sessions</text>
    <rect x="10" y="84" width="372" height="28" rx="6" fill="#1C2130"/>
    <text x="20" y="103" class="mono txt" font-size="13"><tspan class="oc">❯</tspan> Auth refactor <tspan class="dim">(</tspan><tspan class="ag">Agy</tspan><tspan class="dim">+</tspan><tspan class="cx">Codex</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="103" text-anchor="end" class="mono dim" font-size="12">2m</text>
    <text x="20" y="135" class="mono txt" font-size="13">  Flaky e2e test <tspan class="dim">(</tspan><tspan class="cc">Claude</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="135" text-anchor="end" class="mono dim" font-size="12">1h</text>
    <text x="20" y="165" class="mono txt" font-size="13">  GPU crash triage <tspan class="dim">(</tspan><tspan class="km">Kimi</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="165" text-anchor="end" class="mono dim" font-size="12">3h</text>
    <text x="20" y="195" class="mono txt" font-size="13">  Landing page polish <tspan class="dim">(</tspan><tspan class="qw">Qwen</tspan><tspan class="dim">+</tspan><tspan class="pi">Pi</tspan><tspan class="dim">)</tspan></text>
    <text x="372" y="195" text-anchor="end" class="mono dim" font-size="12">1d</text>
    <text x="20" y="225" class="mono txt" font-size="13">  Rate limiter design</text>
    <text x="372" y="225" text-anchor="end" class="mono dim" font-size="12">2d</text>
    <text x="20" y="312" class="sans dim" font-size="11">full history, not a summary</text>
  </g>

  <!-- hop list -->
  <g transform="translate(864 24)">
    <rect width="392" height="330" rx="14" fill="#10131A" stroke="#ffffff" stroke-opacity=".09"/>
    <path d="M14 0H378A14 14 0 0 1 392 14V40H0V14A14 14 0 0 1 14 0Z" fill="#151923"/>
    <circle cx="20" cy="20" r="5" fill="#FF5F57"/><circle cx="37" cy="20" r="5" fill="#FEBC2E"/><circle cx="54" cy="20" r="5" fill="#28C840"/>
    <text x="196" y="25" text-anchor="middle" class="mono sub" font-size="12">terminal</text>
    <text x="20" y="72" class="mono" font-size="12.5"><tspan class="oc">$</tspan><tspan class="txt"> hop list</tspan></text>
    <text x="20" y="100" class="mono txt" font-size="12.5">1. Auth refactor <tspan class="dim">(</tspan><tspan class="ag">Agy</tspan><tspan class="dim">+</tspan><tspan class="cx">Codex</tspan><tspan class="dim">) · 2m ago</tspan></text>
    <text x="20" y="123" class="mono" font-size="12"><tspan class="ag">   Agy      </tspan><tspan class="dim">original</tspan></text>
    <text x="20" y="144" class="mono" font-size="12"><tspan class="cx">   Codex    </tspan><tspan class="dim">mirror  </tspan><tspan class="txt">codex resume 4f1c…</tspan></text>
    <text x="20" y="165" class="mono" font-size="12"><tspan class="cc">   Claude   </tspan><tspan class="dim">mirror  </tspan><tspan class="txt">claude --resume 9b2e…</tspan></text>
    <text x="20" y="186" class="mono" font-size="12"><tspan class="km">   Kimi     </tspan><tspan class="dim">mirror  </tspan><tspan class="txt">kimi -S session_7a…</tspan></text>
    <text x="20" y="216" class="mono txt" font-size="12.5">2. Flaky e2e test <tspan class="dim">(</tspan><tspan class="cc">Claude</tspan><tspan class="dim">) · 1h ago</tspan></text>
    <text x="20" y="239" class="mono" font-size="12"><tspan class="cc">   Claude   </tspan><tspan class="dim">original</tspan></text>
    <text x="20" y="260" class="mono" font-size="12"><tspan class="oc">   OpenCode </tspan><tspan class="dim">mirror  </tspan><tspan class="txt">opencode -s ses_f37…</tspan></text>
    <text x="20" y="290" class="mono" font-size="12.5"><tspan class="oc">$</tspan><tspan class="txt"> hop resume codex 1</tspan></text>
    <text x="20" y="312" class="sans dim" font-size="11">every copy, and the exact command to reopen it</text>
  </g>
</svg>
