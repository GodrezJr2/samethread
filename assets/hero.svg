    <text x="242.5" y="507.7" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
    <circle class="halo" style="animation-delay:0.72s" cx="375.0" cy="429.4" r="36" fill="#34D399"/>
    <circle cx="375.0" cy="429.4" r="24" fill="#0F1117" stroke="#34D399" stroke-width="2"/>
    <text x="375.0" y="434.4" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#34D399">KM</text>
    <text x="375.0" y="485.4" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#E6E8EE">Kimi Code</text>
    <text x="375.0" y="503.4" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
    <circle class="halo" style="animation-delay:1.08s" cx="507.5" cy="402.1" r="36" fill="#5EEAD4"/>
    <circle cx="507.5" cy="402.1" r="24" fill="#0F1117" stroke="#5EEAD4" stroke-width="2"/>
    <text x="507.5" y="407.1" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#5EEAD4">OC</text>
    <text x="507.5" y="458.1" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#E6E8EE">OpenCode</text>
    <text x="507.5" y="476.1" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
    <circle class="halo" style="animation-delay:1.44s" cx="640.0" cy="384.2" r="36" fill="#60A5FA"/>
    <circle cx="640.0" cy="384.2" r="24" fill="#0F1117" stroke="#60A5FA" stroke-width="2"/>
