    <text x="905.0" y="499.0" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
    <circle class="halo" style="animation-delay:2.52s" cx="1037.5" cy="435.5" r="36" fill="#F472B6"/>
    <circle cx="1037.5" cy="435.5" r="24" fill="#0F1117" stroke="#F472B6" stroke-width="2"/>
    <text x="1037.5" y="440.5" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#F472B6">PI</text>
