<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">SameThread</title>
  <desc id="d">One chat thread running through Claude Code, Codex, Kimi Code, OpenCode, Gemini CLI, Antigravity, Qwen Code, Pi and MiniMax Code.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 1 17; animation: flow 1.4s linear infinite; }
      .halo { opacity: .10; animation: pulse 3.2s ease-in-out infinite both; transform-box: fill-box; transform-origin: center; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: .08; transform: scale(1); } 50% { opacity: .22; transform: scale(1.14); } }
      @media (prefers-reduced-motion: reduce) { .flow, .halo { animation: none; } }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8845C" stop-opacity=".18"/><stop offset="1" stop-color="#E8845C" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".18"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <linearGradient id="thread" x1="30" y1="0" x2="1250" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0.000" stop-color="#E8845C"/><stop offset="0.125" stop-color="#F5C451"/><stop offset="0.250" stop-color="#34D399"/><stop offset="0.375" stop-color="#5EEAD4"/><stop offset="0.500" stop-color="#60A5FA"/><stop offset="0.625" stop-color="#8AA4FF"/><stop offset="0.750" stop-color="#A78BFA"/><stop offset="0.875" stop-color="#F472B6"/><stop offset="1.000" stop-color="#FB7185"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0A07F"/><stop offset=".5" stop-color="#7EF0DE"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1280" height="600" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="600" fill="#0A0B10"/>
    <rect width="1280" height="600" fill="url(#grid)"/>
    <circle cx="200" cy="440" r="360" fill="url(#g1)"/>
    <circle cx="660" cy="110" r="440" fill="url(#g2)"/>
    <circle cx="1080" cy="440" r="360" fill="url(#g3)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="599" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <text x="80" y="92" class="sans" font-size="14" font-weight="600" letter-spacing="5" fill="#9AA3B5">SAMETHREAD</text>
  <text x="80" y="160" class="sans" font-size="56" font-weight="700" fill="#F4F5F7" letter-spacing="-1">Hop between coding agents.</text>
  <text x="80" y="226" class="sans" font-size="56" font-weight="700" fill="#F4F5F7" letter-spacing="-1">Stay on the <tspan fill="url(#word)">same thread</tspan>.</text>
  <text x="80" y="276" class="sans" font-size="20" fill="#A3ABBC">One chat history across nine coding agents, right inside each agent's own /resume.</text>

  <path d="M30.0 428.0 C43.3 425.0 74.6 409.0 110.0 410.0 C145.4 411.0 198.3 430.5 242.5 433.7 C286.7 437.0 330.8 434.7 375.0 429.4 C419.2 424.1 463.3 409.6 507.5 402.1 C551.7 394.6 595.8 385.1 640.0 384.2 C684.2 383.3 728.3 390.0 772.5 396.8 C816.7 403.6 860.8 418.6 905.0 425.0 C949.2 431.5 993.3 437.0 1037.5 435.5 C1081.7 434.0 1134.6 421.1 1170.0 415.8 C1205.4 410.5 1236.7 405.8 1250.0 403.8" fill="none" stroke="url(#thread)" stroke-width="10" stroke-opacity=".35" filter="url(#blur)"/>
  <path id="line" d="M30.0 428.0 C43.3 425.0 74.6 409.0 110.0 410.0 C145.4 411.0 198.3 430.5 242.5 433.7 C286.7 437.0 330.8 434.7 375.0 429.4 C419.2 424.1 463.3 409.6 507.5 402.1 C551.7 394.6 595.8 385.1 640.0 384.2 C684.2 383.3 728.3 390.0 772.5 396.8 C816.7 403.6 860.8 418.6 905.0 425.0 C949.2 431.5 993.3 437.0 1037.5 435.5 C1081.7 434.0 1134.6 421.1 1170.0 415.8 C1205.4 410.5 1236.7 405.8 1250.0 403.8" fill="none" stroke="url(#thread)" stroke-width="2.5" stroke-linecap="round"/>
  <path class="flow" d="M30.0 428.0 C43.3 425.0 74.6 409.0 110.0 410.0 C145.4 411.0 198.3 430.5 242.5 433.7 C286.7 437.0 330.8 434.7 375.0 429.4 C419.2 424.1 463.3 409.6 507.5 402.1 C551.7 394.6 595.8 385.1 640.0 384.2 C684.2 383.3 728.3 390.0 772.5 396.8 C816.7 403.6 860.8 418.6 905.0 425.0 C949.2 431.5 993.3 437.0 1037.5 435.5 C1081.7 434.0 1134.6 421.1 1170.0 415.8 C1205.4 410.5 1236.7 405.8 1250.0 403.8" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
  <circle r="5" fill="#ffffff" filter="url(#dotglow)">
    <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"><mpath href="#line"/></animateMotion>
  </circle>
  <g>
    <circle class="halo" style="animation-delay:0.00s" cx="110.0" cy="410.0" r="36" fill="#E8845C"/>
    <circle cx="110.0" cy="410.0" r="24" fill="#0F1117" stroke="#E8845C" stroke-width="2"/>
    <text x="110.0" y="415.0" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#E8845C">CC</text>
    <text x="110.0" y="466.0" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#E6E8EE">Claude Code</text>
    <text x="110.0" y="484.0" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
