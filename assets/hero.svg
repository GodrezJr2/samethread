    <text x="1037.5" y="509.5" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">native</text>
    <circle class="halo" style="animation-delay:2.88s" cx="1170.0" cy="415.8" r="36" fill="#FB7185"/>
    <circle cx="1170.0" cy="415.8" r="24" fill="#0F1117" stroke="#FB7185" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="1170.0" y="420.8" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#FB7185">MM</text>
    <text x="1170.0" y="471.8" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#E6E8EE">MiniMax Code</text>
    <text x="1170.0" y="489.8" text-anchor="middle" class="sans" font-size="11.5" fill="#7D8596">read + handoff</text>
  </g>
</svg>
