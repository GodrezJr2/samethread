<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">SameThread</title>
  <desc id="d">One chat thread flowing through Claude Code, OpenCode and Antigravity CLI. Each tool's resume list shows the same conversation, tagged with where it has been.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 1 17; animation: flow 1.4s linear infinite; }
      .halo { opacity: .12; animation: pulse 3.2s ease-in-out infinite both; transform-box: fill-box; transform-origin: center; }
      .halo.b { animation-delay: 1.07s; } .halo.c { animation-delay: 2.13s; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: .10; transform: scale(1); } 50% { opacity: .22; transform: scale(1.12); } }
      @media (prefers-reduced-motion: reduce) { .flow, .halo { animation: none; } }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <radialGradient id="gOrange" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8845C" stop-opacity=".20"/><stop offset="1" stop-color="#E8845C" stop-opacity="0"/></radialGradient>
    <radialGradient id="gTeal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".10"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBlue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8AA4FF" stop-opacity=".20"/><stop offset="1" stop-color="#8AA4FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="thread" x1="40" y1="0" x2="1240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8845C"/><stop offset=".5" stop-color="#5EEAD4"/><stop offset="1" stop-color="#8AA4FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A07F"/><stop offset=".5" stop-color="#7EF0DE"/><stop offset="1" stop-color="#A5B8FF"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1280" height="600" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="600" fill="#0A0B10"/>
    <rect width="1280" height="600" fill="url(#grid)"/>
    <circle cx="250" cy="430" r="340" fill="url(#gOrange)"/>
    <circle cx="660" cy="120" r="420" fill="url(#gTeal)"/>
    <circle cx="1040" cy="430" r="340" fill="url(#gBlue)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="599" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <text x="80" y="92" class="sans" font-size="14" font-weight="600" letter-spacing="5" fill="#9AA3B5">SAMETHREAD</text>
  <text x="80" y="160" class="sans" font-size="56" font-weight="700" fill="#F4F5F7" letter-spacing="-1">Hop between coding agents.</text>
  <text x="80" y="226" class="sans" font-size="56" font-weight="700" fill="#F4F5F7" letter-spacing="-1">Stay on the <tspan fill="url(#word)">same thread</tspan>.</text>
  <text x="80" y="276" class="sans" font-size="20" fill="#A3ABBC">One chat history across Claude Code, OpenCode and Antigravity CLI, right inside each tool's own /resume.</text>

  <path d="M40 452 C120 470 180 420 250 420 C360 420 470 372 640 420 C800 466 900 420 1030 420 C1120 420 1170 396 1240 404" fill="none" stroke="url(#thread)" stroke-width="10" stroke-opacity=".35" filter="url(#blur)"/>
  <path id="line" d="M40 452 C120 470 180 420 250 420 C360 420 470 372 640 420 C800 466 900 420 1030 420 C1120 420 1170 396 1240 404" fill="none" stroke="url(#thread)" stroke-width="2.5" stroke-linecap="round"/>
  <path class="flow" d="M40 452 C120 470 180 420 250 420 C360 420 470 372 640 420 C800 466 900 420 1030 420 C1120 420 1170 396 1240 404" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round"/>
  <circle r="5" fill="#ffffff" filter="url(#dotglow)">
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"><mpath href="#line"/></animateMotion>
  </circle>

  <g class="sans">
    <circle class="halo" cx="250" cy="420" r="46" fill="#E8845C"/>
    <circle cx="250" cy="420" r="30" fill="#0F1117" stroke="#E8845C" stroke-width="2"/>
    <text x="250" y="426" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#E8845C">CC</text>
    <text x="250" y="490" text-anchor="middle" font-size="18" font-weight="600" fill="#E6E8EE">Claude Code</text>

    <circle class="halo b" cx="640" cy="420" r="46" fill="#5EEAD4"/>
    <circle cx="640" cy="420" r="30" fill="#0F1117" stroke="#5EEAD4" stroke-width="2"/>
    <text x="640" y="426" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#5EEAD4">OC</text>
    <text x="640" y="490" text-anchor="middle" font-size="18" font-weight="600" fill="#E6E8EE">OpenCode</text>

    <circle class="halo c" cx="1030" cy="420" r="46" fill="#8AA4FF"/>
    <circle cx="1030" cy="420" r="30" fill="#0F1117" stroke="#8AA4FF" stroke-width="2"/>
    <text x="1030" y="426" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#8AA4FF">AG</text>
    <text x="1030" y="490" text-anchor="middle" font-size="18" font-weight="600" fill="#E6E8EE">Antigravity CLI</text>
  </g>

  <g>
    <rect x="110" y="508" width="280" height="60" rx="10" fill="#12151D" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="126" y="533" class="mono" font-size="13" fill="#E5E7EB">❯ Auth refactor <tspan fill="#6B7385">(</tspan><tspan fill="#8AA4FF">Agy</tspan><tspan fill="#6B7385">+</tspan><tspan fill="#5EEAD4">OpenCode</tspan><tspan fill="#6B7385">)</tspan></text>
    <text x="126" y="553" class="sans" font-size="12" fill="#7D8596">mirror · listed in /resume</text>

    <rect x="500" y="508" width="280" height="60" rx="10" fill="#12151D" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="516" y="533" class="mono" font-size="13" fill="#E5E7EB">❯ Auth refactor <tspan fill="#6B7385">(</tspan><tspan fill="#8AA4FF">Agy</tspan><tspan fill="#6B7385">+</tspan><tspan fill="#5EEAD4">OpenCode</tspan><tspan fill="#6B7385">)</tspan></text>
    <text x="516" y="553" class="sans" font-size="12" fill="#7D8596">live copy · listed in /sessions</text>

    <rect x="890" y="508" width="280" height="60" rx="10" fill="#12151D" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="906" y="533" class="mono" font-size="13" fill="#E5E7EB">❯ Auth refactor</text>
    <text x="906" y="553" class="sans" font-size="12" fill="#7D8596">original · Stop hook syncs every turn</text>
  </g>
</svg>
